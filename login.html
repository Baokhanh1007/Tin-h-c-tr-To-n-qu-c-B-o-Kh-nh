<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
  <div class="container">
    <h1>AI CHO HỌC SINH VIỆT</h1>
    <!-- Form Đăng Nhập -->
    <div id="login-form">
      <h2>Đăng Nhập</h2>
      <form id="login">
        <label for="login-email">Email:</label>
        <input type="email" id="login-email" placeholder="Nhập email" required><br>
        <label for="login-password">Mật khẩu:</label>
        <input type="password" id="login-password" placeholder="Nhập mật khẩu" required><br>
        
        <button type="submit" href="index.html">Đăng Nhập</button>
      </form>
      <p>Bạn chưa có tài khoản? <a href="#" id="show-register">Đăng ký</a></p>
    </div>

    <!-- Form Đăng Ký -->
    <div id="register-form" style="display: none;">
      <h2>Đăng Ký</h2>
      <form id="register">
          <input type="text" id="register-username" placeholder="Tên đăng nhập" required>
          <br>
          <input type="text" id="nickname" placeholder="Biệt danh" required>
          <br>
          <input type="email" id="register-email" placeholder="Nhập email" required>
          <br>
          <input type="text" id="phone" placeholder="Số điện thoại" required>
          <br>
          <input type="password" id="register-password" placeholder="Nhập mật khẩu" required>
          <br>
          <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu" required>
          <button type="submit">Đăng Ký</button>
</form>
      <p>Bạn đã có tài khoản? <a href="#" id="show-login">Đăng nhập</a></p>
    </div>
  </div>
    <script src="login.js"></script>
  </body>
</html>
